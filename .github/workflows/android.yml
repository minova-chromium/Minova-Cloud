name: Build Minova Cloud

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version after checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: minova-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check version and compile
        run: |
          chmod +x gradlew
          node scripts/release-info.mjs validate
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Keep preview build
        uses: actions/upload-artifact@v7
        with:
          name: Preview-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Restore Android signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.MINOVA_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Configure the Android signing secrets before building a release.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minova-cloud.jks'
          destination.write_bytes(base64.b64decode(value, validate=True))
          destination.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MINOVA_KEYSTORE=' + str(destination) + '\n')
          PY
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        env:
          MINOVA_KEYSTORE_PASSWORD: ${{ secrets.MINOVA_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          node scripts/release-info.mjs package
      - name: Keep signed build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Signed-${{ github.sha }}
          path: releases/
          retention-days: 90

  release:
    if: github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: minova-cloud-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Signed-${{ github.sha }}
          path: releases
      - name: Prepare or publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
        run: node scripts/publish-release.mjs
